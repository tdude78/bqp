<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420">
  <rect width="720" height="420" fill="#fcfaf5"/>
  <defs>
    <marker id="arrowhead" markerWidth="12" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 11 4, 0 8" fill="rgb(134,31,65)"/>
    </marker>
  </defs>

  <!-- Virginia Tech palette: myRed=#862041, myOrange=#BF5700 -->
  <!-- Three equal circles in symmetric equilateral Venn arrangement -->

  <!-- Conjunction Assessment / Remediation (top) -->
  <circle cx="340" cy="145" r="118" fill="rgba(191,87,0,0.18)" stroke="rgba(191,87,0,0.68)" stroke-width="1.8"/>
  <!-- Constellation Design (bottom-left) -->
  <circle cx="252" cy="268" r="118" fill="rgba(0,0,0,0.07)" stroke="rgba(0,0,0,0.28)" stroke-width="1.8"/>
  <!-- Stochastic Optimization (bottom-right) -->
  <circle cx="428" cy="268" r="118" fill="rgba(134,31,65,0.13)" stroke="rgba(134,31,65,0.42)" stroke-width="1.8"/>

  <!-- Pillar titles (positioned in exclusive zones, away from overlaps) -->
  <text x="340" y="66" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18.5" font-weight="bold" fill="#862041">Conjunction</text>
  <text x="340" y="88" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18.5" font-weight="bold" fill="#862041">Assessment /</text>
  <text x="340" y="110" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18.5" font-weight="bold" fill="#862041">Remediation</text>

  <text x="232" y="273" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17.5" font-weight="bold" fill="#862041">Constellation</text>
  <text x="232" y="295" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17.5" font-weight="bold" fill="#862041">Design</text>

  <text x="448" y="273" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17.5" font-weight="bold" fill="#862041">Stochastic</text>
  <text x="448" y="295" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17.5" font-weight="bold" fill="#862041">Optimization</text>

  <!-- Supporting citations -->
  <text x="340" y="136" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#4a4a4a">(Jarry et al., 2019)</text>
  <text x="340" y="151" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#4a4a4a">(Cordelli et al., 2022)</text>

  <text x="232" y="324" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#4a4a4a">(Walker, 1984)</text>
  <text x="232" y="339" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#4a4a4a">(Mortari et al., 2004)</text>

  <text x="448" y="324" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#4a4a4a">(Bertsimas and Sim, 2004)</text>
  <text x="448" y="339" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#4a4a4a">(Esfahani and Kuhn, 2018)</text>

  <!-- Dissertation callout -->
  <rect x="504" y="80" width="124" height="58" rx="5" ry="5" fill="white" stroke="rgba(0,0,0,0.50)" stroke-width="1.5"/>
  <text x="566" y="104" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17">This</text>
  <text x="566" y="126" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17">Dissertation</text>

  <!-- Arrow to triple-overlap center (smooth quadratic bezier) -->
  <path d="M506,109 Q430,160 347,225" fill="none" stroke="rgb(134,31,65)" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arrowhead)"/>
</svg>
