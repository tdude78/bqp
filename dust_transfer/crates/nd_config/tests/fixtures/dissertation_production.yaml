# NOT THE PART A PRODUCTION SHAPE, despite the filename and `role: production`.
# This is a config-LOADING fixture: its values are frozen so the loader's
# behaviour is testable, and they are deliberately NOT tracked to the sealed
# campaign authority. They already differ from it.
#
# No sealed value is restated here on purpose. A literal in this header would
# have no reader and no gate, so it would decay at the next reseal and mislead
# whoever trusted it -- which is the failure this warning exists to prevent, and
# which two comments in this tree have already committed.
#
# Read it as "a valid production-role config", never as "what the campaign
# runs". Anything sizing or profiling the campaign must read the compiled
# authority instead; two harnesses have already been caught profiling a config
# the campaign stopped flying, both because a name promised currency that the
# contents did not carry.
