beta_dist:
  # Operational search controller. One run-level CRN permutation is consumed at
  # targets k(n)=min(N, initial_batch_size + followup_batch_size*n). Reported PDF
  # convergence or a conclusive hard failure may stop a search candidate early.
  # Final reporting and authoritative archive admission use canonical replay.
  prior_alpha: 1.0
  prior_beta: 1.0
  convergence_half_width: 0.02
  quantile: 0.9
  sequential_stop_policy: threshold_directed
  convergence_pdf_threshold: 4.0
  # Adaptive sequential sampler: start at initial_batch_size events, check PDF at
  # the Beta posterior mode, add followup_batch_size, and re-check until PDF
  # convergence, conclusive hard failure, or finite-pool exhaustion. Production
  # targets are 24 -> 32 -> 40 -> ... up to finite search-bank exhaustion;
  # later targets are skipped once a stop condition is met. Exact publication
  # replay remains a separate immutable 64-event bank.
  initial_batch_size: 24
  followup_batch_size: 8
  success_rate_estimator: posterior_mean
  # HPD (highest-posterior-density) interval classifies operational hard failures.
  # It is not a catalogue-population probability claim and does not replace the
  # exact finite-bank service fraction used by canonical reporting.
  credible_interval_method: hpd
  # SEARCH-ONLY per-event aggregation statistic for the optimizer's scalar
  # dv & mass objectives. This is a search diagnostic/controller, NOT the
  # canonical publication authority. Canonical (schema-5) results are the
  # exact joint event-coverage DV/mass Pareto front with coverage eligibility
  # ceil(q*N) = 58 of 64; no scalar aggregation defines the published front.
  #   max      -> worst-case over feasible events (historical default; the
  #               worst-event collapse that makes many distinct designs share
  #               one (dv,mass) point and flattens the Pareto front)
  #   quantile -> feasible-event quantile at beta_dist.quantile (softer worst-case)
  #   cvar     -> feasible-event CVaR at beta_dist.quantile (tail mean)
  #   mean     -> feasible-event mean (typical case)
  # Softer statistics densify the search front (distinct designs -> distinct
  # search objectives).
  # PROMOTED max -> cvar 2026-07-03 on cross-family A/B (campaigns xfam_{walker,
  # dual,flower,arbitrary}, nsga2 x4 seeds x ev32/pop24/nfev1000): front
  # distinct_eps rose in EVERY family (walker 4->9.5, dual 5->7.5, flower
  # 3.5->11, arbitrary 5->8). The sparse `max` front is an artifact of
  # max-over-events near-1D collapse; CVaR-90 is a coherent tail-risk measure
  # (mean of the worst 10% of feasible events) that reveals more of the real
  # dv/mass trade-off for search scheduling. cvar forces full event scope when
  # the ladder is on (cvarfix 0c9b479e) so every row estimates the
  # same-support statistic.
  objective_aggregation: cvar
objectives:
  min_success_rate: 0.9
  success_target: 0.95
  hard_dv_km_s: 2.5
  hard_mass_kg: 1000.0
  search_constellation_size_penalty_alpha: 0.10
  # Report and search-prefer the lowest-dV FEASIBLE front row rather than a
  # generation-rotated one, aligning the reported scalar with the dissertation's
  # dV objective. Only feasible rows are eligible, so success/mass constraints are
  # unchanged; the soft threshold sits just above the front's operating dV so it
  # bites where low-dV is achievable and is inert otherwise. Validated by HV A/B.
  search_dv_selection_pressure: true
  search_soft_dv_km_s: 0.20
evaluation:
  crn: true
  event_sample_count: until_convergence
  event_sample_seed: 20260212
  search_event_bank:
    count: 500
    selection_policy: catalogue_prefix
  diagnostics:
    # Per-event phase timing for the aggregated population_objective telemetry
    # (event_loop / deterministic_mass). Off by default; the TC job generator
    # flips it true so campaign JSONs carry the decomposition (one short lock
    # per event, no numeric-path effect). Declared here so the strict
    # production schema admits the key.
    event_timing_trace: false
  event_ladder:
    # Disabled: when enabled the runtime forces beta_dist_event_scope='all' (one
    # batch over the full stage), which BYPASSES the adaptive sequential sampler
